[project]
root = "."

[languages]
rust       = { grammar = "tree-sitter-rust",       enabled = true }
typescript = { grammar = "tree-sitter-typescript", enabled = true }
python     = { grammar = "tree-sitter-python",     enabled = true }
zig        = { grammar = "tree-sitter-zig",        enabled = true }

# Mapeados — arquivos aqui são analisados e devem ter layer
[layers]
L0  = "00_nucleo"
L1  = "01_core"
L2  = "02_shell"
L3  = "03_infra"
L4  = "04_wiring"
lab = "lab"

[excluded]
build    = "target"
deps     = "node_modules"
vcs      = ".git"
cargo    = ".cargo"
temp     = "tmp"
venv1    = ".venv"
venv2    = "venv"
pycache  = "__pycache__"
# Corpo de fixtures (prompt 0054): workspaces deliberadamente quebrados, com
# os seus próprios crystalline.toml/00_nucleo. Dados de teste, fora da topologia
# de camadas do linter — excluídos do self-lint (file walker e prompt walker).
fixtures = "tests"
# Oráculo diferencial (0058): crate standalone que path-depende da lente e invoca o
# binário do linter. Não é parte do crate do linter — fora da topologia de camadas.
oraculo  = "oraculo"

[excluded_files]
# Ficheiros individuais excluídos por path relativo à raiz do projecto.
# Distinto de [excluded] que opera sobre nomes de directório.
# lib.rs é o ponto de reexport da crate — fora da topologia de camadas
# por razões estruturais do Rust. Ver ADR-0010.
crate_root = "lib.rs"

# Rust module name → layer (used by LayerResolver for crate:: imports)
[module_layers]
entities  = "L1"
contracts = "L1"
rules     = "L1"
shell     = "L2"
infra     = "L3"

# Portas públicas de L1 — únicos subdiretórios acessíveis de L2/L3
# Imports de outros subdiretórios de L1 disparam V9 (ADR-0006)
[l1_ports]
entities  = "entities"
contracts = "contracts"
rules     = "rules"

# Prompts que existem legitimamente sem materialização Rust (ADR-0006)
[orphan_exceptions]
"00_nucleo/prompts/cargo.md"                   = "gera Cargo.toml, não arquivo Rust"
"00_nucleo/prompts/readme_prompt.md"           = "gera README.md, não arquivo Rust"
"00_nucleo/prompts/parsers/_template.md"       = "contrato editorial, não materializa directamente"
"00_nucleo/prompts/parsers/zig.md"              = "documentação do parser zig"
"00_nucleo/prompts/architecture-standards.md"  = "padrões globais de gestão de prompts"
"00_nucleo/prompts/corpo-de-fixtures.md"        = "materializa fixtures+harness em tests/ (excluído), não arquivo Rust"
"00_nucleo/prompts/fechar-extracao-v6-v12-v2.md" = "fixtures de extração V6/V12/V2 em tests/ (excluído), não arquivo Rust"
"00_nucleo/prompts/reconciliar-sobreviventes.md" = "reconciliação/documentação de mutantes — não materializa Rust"
"00_nucleo/prompts/mutacao-caminho-veredito.md"  = "fixtures de config/walker em tests/ (excluído), não arquivo Rust"
"00_nucleo/prompts/oraculo-diferencial.md"       = "oráculo diferencial: instrumentação --emit + harness cross-repo, não materializa regra"
"00_nucleo/prompts/consertar-cego-1-3.md"        = "conserto do resolvedor (alias/rename) + fixtures em tests/ (excluído)"
"00_nucleo/prompts/consertar-cego-2.md"          = "conserto do cego #2 (path-ref fora do use) — estende rs_parser.rs (nucleado por parsers/rust.md) + fixtures em tests/ (excluído)"
"00_nucleo/prompts/excluir-teste-gravidade.md"   = "política de regra (V3/V9/V14 excluem #[cfg(test)] por padrão) — revê rules/* + parsers/rust.md + linter-core.md + fixtures em tests/ (excluído)"
"00_nucleo/prompts/versao-linter.md"             = "processo de release (versão, portões, CHANGELOG, tag) — não materializa Rust; toca Cargo.toml e CHANGELOG.md"

# Exceções V12 — declarações permitidas em L4
# true = permite struct_item em L4 (padrão — adapter structs são comuns)
# enum_item e impl_item sem trait são sempre proibidos
[wiring_exceptions]
allow_adapter_structs = true

# TypeScript path aliases — opcional (apenas para projectos com tsconfig.json paths)
# [ts_aliases]
# "@core"  = "01_core"
# "@shell" = "02_shell"
# "@infra" = "03_infra"

# Python package aliases — opcional (mapeia package name → layer dir)
# [py_aliases]
# "core"  = "01_core"
# "shell" = "02_shell"
# "infra" = "03_infra"

[rules]
V0  = { level = "fatal" }
V1  = { level = "error" }
V2  = { level = "error" }
V3  = { level = "error" }
V4  = { level = "error" }
V5  = { level = "warning" }
V6  = { level = "warning" }
V7  = { level = "warning" }
V8  = { level = "fatal" }
V9  = { level = "error" }
V10 = { level = "fatal" }
V11 = { level = "error" }
V12 = { level = "warning" }
V13 = { level = "error" }
V14 = { level = "error" }
V15 = { level = "error" }
V16 = { level = "warning", languages = ["rust"] }
V17 = { level = "warning", languages = ["rust"] }
V18 = { level = "warning", languages = ["rust"] }
V19 = { level = "info", languages = ["rust"] }
V20 = { level = "info", languages = ["rust"] }
V21 = { level = "warning", languages = ["rust"] }
V22 = { level = "info", languages = ["rust"] }
V23 = { level = "warning", languages = ["rust"] }
V24 = { level = "warning", languages = ["rust"] }
V25 = { level = "warning", languages = ["rust"] }

# V23–V25 só analisam contratos explicitamente declarados. Exemplos completos em
# USAGE.md. A ausência destas tabelas é válida e produz zero achados semânticos.
# [[semantic.context]]
# [[semantic.projection]]
# [[semantic.decision]]

[wildcard_exceptions]

[l1_allowed_external]
# Pacotes externos explicitamente autorizados em L1.
# L1 é fechada por defeito — qualquer externo não listado é Error (V14).
# thiserror: derive(Error) para tipos de erro de domínio (L1).
rust       = ["thiserror"]
typescript = []
python     = []
zig        = []

[analysis.lineage]
strict_directories = ["01_core", "02_shell", "03_infra", "04_wiring"]
